<ion-content fullscreen class="ion-no-scroll">
  <div class="manual-otp-container" [class.scanner-active]="scanMode">
    
    <!-- Black Camera Scanner Simulation Area -->
    <div class="scanner-view" (click)="setScanMode(true)">
      <!-- Simulated / Real camera container (Background) -->
      <div class="scanner-camera-simulation">
        <video id="camera-feed" class="camera-video" autoplay playsinline [class.visible]="scanMode && !cameraLoading && !cameraPermissionDenied"></video>
      </div>
      
      <!-- Target box (Flex item 1) -->
      <div class="scanner-target-box" [class.laser-scanning]="scanMode">
        <div class="bracket top-left"></div>
        <div class="bracket top-right"></div>
        <div class="bracket bottom-left"></div>
        <div class="bracket bottom-right"></div>
        
        <!-- Scan Lottie animation overlay -->
        <dotlottie-player *ngIf="scanMode" src="assets/lottie/scan.lottie" autoplay loop style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0.85;"></dotlottie-player>

        <!-- Camera Loading Text centered inside brackets -->
        <div class="scanner-loading-text" *ngIf="cameraLoading || (scanMode && cameraPermissionDenied)">
          <span *ngIf="cameraLoading">Loading camera...</span>
          <span *ngIf="!cameraLoading && cameraPermissionDenied" style="font-size: 9px; color: #ff453a; line-height: 1.2; display: block; word-break: break-word; text-shadow: none;">
            {{ cameraErrorMessage || 'Simulated scan view...' }}
          </span>
        </div>
        <div class="scanner-loading-text" *ngIf="!scanMode">
        </div>
      </div>
      
      <!-- Scanner Control Action bar (Flex item 2) -->
      <div class="scanner-action-row" (click)="$event.stopPropagation()">
        <!-- White circular Back Button -->
        <button class="scanner-back-btn" (click)="goBack()" aria-label="Go Back">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" style="display: block;">
            <path d="M19 12H5M12 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
        
        <!-- Capsule Switch Button (Toggles Scan QR vs Enter OTP) -->
        <button class="scanner-qr-btn" (click)="toggleScanMode()" *ngIf="!scanOnly">
          <!-- Barcode icon shown when in Scan QR mode (click to Enter OTP) -->
          <span class="qr-brackets-icon" *ngIf="scanMode">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5">
              <rect x="3" y="6" width="2" height="12" rx="0.5" fill="currentColor" stroke="none" />
              <rect x="7" y="6" width="2" height="12" rx="0.5" fill="currentColor" stroke="none" />
              <rect x="11" y="6" width="2" height="12" rx="0.5" fill="currentColor" stroke="none" />
              <rect x="15" y="6" width="2" height="12" rx="0.5" fill="currentColor" stroke="none" />
              <rect x="19" y="6" width="2" height="12" rx="0.5" fill="currentColor" stroke="none" />
            </svg>
          </span>
          <!-- QR corners icon shown when in Enter OTP mode (click to Scan QR) -->
          <span class="qr-brackets-icon" *ngIf="!scanMode">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M 4,8 L 4,4 L 8,4" stroke-linecap="round" />
              <path d="M 16,4 L 20,4 L 20,8" stroke-linecap="round" />
              <path d="M 4,16 L 4,20 L 8,20" stroke-linecap="round" />
              <path d="M 16,20 L 20,20 L 20,16" stroke-linecap="round" />
            </svg>
          </span>
          {{ scanMode ? 'Enter OTP' : 'Scan QR' }}
        </button>
      </div>
    </div>

    <!-- Bottom white entry container layout matching screenshot -->
    <div class="otp-card-bottom" *ngIf="!scanOnly" (click)="setScanMode(false)" (touchstart)="onTouchStart($event)" (touchend)="onTouchEnd($event)">
      <!-- Top Row with blue card and Thiruvalluvar quote -->
      <div class="otp-card-top-row">
        <!-- Blue payment logo card -->
        <div class="blue-payment-logo-card">
          <img src="assets/images/mt_ic_bus_otp_card.webp" class="bus-otp-card-img" alt="Card Logo" onerror="this.src='assets/mt_ic_bus_otp_card.webp'">
        </div>
        
        <!-- Thiruvalluvar Quote Box -->
        <div class="saint-quote-box">
          <img src="assets/images/mt_ic_thiruvalluvar.webp" class="saint-avatar-img" alt="Thiruvalluvar" onerror="this.src='assets/thiruvalluvar.jpg'" />
          <div class="saint-quote-text font-anek-tamil">
            தெய்வத்தான் ஆகா தெனினும் முயற்சிதன்<br>மெய்வருத்தக் கூலி தரும்
          </div>
        </div>
      </div>

      <!-- Entry character box row -->
      <div class="otp-digits-line-row">
        <div class="otp-digit-line-item" *ngFor="let index of [0, 1, 2, 3, 4]">
          <div class="digit-box" [class.filled]="digits[index]" [class.active]="digits.length === index">
            <!-- Text color transforms: numbers become dark, alphabet become dull -->
            <span class="digit-text" 
                  [class.is-first]="index === 0"
                  [class.is-number]="digits[index] && isNumber(digits[index])"
                  [class.is-letter]="digits[index] && !isNumber(digits[index])">
              {{ digits[index] || '' }}
            </span>
            <span class="digit-bottom-line" *ngIf="!digits[index]"></span>
          </div>
        </div>
      </div>

      <!-- Book button with loader state -->
      <button class="book-bus-ticket-btn" [class.active]="isComplete && !isFetchingData" [disabled]="isFetchingData" (click)="goBooking()">
        <span *ngIf="!isFetchingData">Book Bus ticket &gt;&gt;</span>
        <span *ngIf="isFetchingData" style="display: flex; align-items: center; justify-content: center; gap: 6px;">
          <dotlottie-player src="assets/lottie/mt_ic_loading_dots_white_lottie.lottie" autoplay loop style="width: 50px; height: 28px; display: inline-block;"></dotlottie-player>
        </span>
      </button>

      <!-- Custom Keyboard Layout -->
      <div class="custom-keyboard-container" [class.hidden]="scanMode" [class.is-first-char]="digits.length === 0">
        <!-- Alphabet Row -->
        <div class="keyboard-alphabet-row">
          <button class="keyboard-key-btn alphabet-key" (click)="press('I')">I</button>
          <button class="keyboard-key-btn alphabet-key" (click)="press('S')">S</button>
          <button class="keyboard-key-btn alphabet-key" (click)="press('J')">J</button>
          <button class="keyboard-key-btn alphabet-key" (click)="press('K')">K</button>
          <button class="keyboard-key-btn alphabet-key" (click)="press('L')">L</button>
        </div>

        <!-- Number Pad Grid -->
        <div class="keyboard-number-pad">
          <!-- Row 1 -->
          <button class="keyboard-key-btn font-number" (click)="press('1')">1</button>
          <button class="keyboard-key-btn font-number" (click)="press('2')">2</button>
          <button class="keyboard-key-btn font-number" (click)="press('3')">3</button>

          <!-- Row 2 -->
          <button class="keyboard-key-btn font-number" (click)="press('4')">4</button>
          <button class="keyboard-key-btn font-number" (click)="press('5')">5</button>
          <button class="keyboard-key-btn font-number" (click)="press('6')">6</button>

          <!-- Row 3 -->
          <button class="keyboard-key-btn font-number" (click)="press('7')">7</button>
          <button class="keyboard-key-btn font-number" (click)="press('8')">8</button>
          <button class="keyboard-key-btn font-number" (click)="press('9')">9</button>

          <!-- Row 4 -->
          <button class="keyboard-key-btn text-clear-btn" (click)="clearAll()">Clear</button>
          <button class="keyboard-key-btn font-number" (click)="press('0')">0</button>
          <button class="keyboard-key-btn delete-btn" (click)="backspace()" aria-label="Delete">
            <!-- Cross Delete Button SVG -->
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" style="display: block;">
              <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z" stroke-linecap="round" stroke-linejoin="round" />
              <line x1="18" y1="9" x2="12" y2="15" stroke-linecap="round" stroke-linejoin="round" />
              <line x1="12" y1="9" x2="18" y2="15" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </div>
      </div>
    </div>
    
    <!-- ================= QR POPUP MODAL OVERLAY ================= -->
    <div class="qr-modal-backdrop" *ngIf="showQrModal" (click)="closeQrModalOnly($event)">
      <div class="qr-modal-content" (click)="$event.stopPropagation()">
        <div class="qr-header">
          <h3>Scan Ticket QR</h3>
          <button class="qr-close-btn" (click)="closeQrModalOnly($event)">✕</button>
        </div>
        <div class="qr-img-container" (click)="closeQrModalAndNavigate()">
          <img src="assets/qr.png" alt="Scan QR Code" class="qr-code-image" />
          <div class="scanner-line"></div>
        </div>
        <p class="qr-footer-text">Tap QR code image to proceed to booking</p>
      </div>
    </div>

  </div>
</ion-content>
