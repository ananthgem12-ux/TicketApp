<div class="custom-bottom-nav">
  <!-- 1. Home Tab -->
  <div class="nav-item" [class.active]="activeTab === 'home'" (click)="navTo('home')">
    <div class="nav-icon-box">
      <svg class="nav-svg home-svg" viewBox="0 0 24 24">
        <rect x="11.2" y="4" width="1.6" height="15" fill="currentColor" />
        <path d="M 6.5,5 H 16 L 19.5,7.5 L 16,10 H 6.5 C 6,10 5.5,9.5 5.5,9 V 6 C 5.5,5.5 6,5 6.5,5 Z" fill="currentColor" />
        <path d="M 17.5,11 H 8 L 4.5,13.5 L 8,16 H 17.5 C 18,16 18.5,15.5 18.5,15 V 12 C 18.5,11.5 18,11 17.5,11 Z" fill="currentColor" />
      </svg>
    </div>
    <span class="nav-label">Home</span>
  </div>

  <!-- 2. Tickets Tab -->
  <div class="nav-item" [class.active]="activeTab === 'ticket'" (click)="navTo('ticket')">
    <div class="nav-icon-box">
      <svg class="nav-svg" viewBox="0 0 24 24">
        <path d="M 6.5,3 L 9.5,3 C 9.5,4.5 10.5,5.5 12,5.5 C 13.5,5.5 14.5,4.5 14.5,3 L 17.5,3 C 18,3 18.5,3.5 18.5,4 L 18.5,19 C 18.5,19.5 18,20 17.5,20 L 14.5,20 C 14.5,18.5 13.5,17.5 12,17.5 C 10.5,17.5 9.5,18.5 9.5,20 L 6.5,20 C 6,20 5.5,19.5 5.5,19 L 5.5,4 C 5.5,3.5 6,3 6.5,3 Z" fill="currentColor" />
      </svg>
    </div>
    <span class="nav-label">Tickets</span>
  </div>

  <!-- 3. Center Floating BUS OTP / BUS QR Button -->
  <div class="center-btn-wrapper" (click)="openBusOtp()">
    <div class="center-floating-btn">
      <!-- Mode: BUS OTP -->
      <div class="center-icon-container" *ngIf="centerMode === 'otp'">
        <svg class="center-btn-svg" viewBox="0 0 32 32">
          <!-- 4 corner brackets -->
          <path d="M 6.5,11.5 A 3.5,3.5 0 0 1 11.5,6.5" fill="none" stroke="white" stroke-width="2.6" stroke-linecap="round" />
          <path d="M 20.5,6.5 A 3.5,3.5 0 0 1 25.5,11.5" fill="none" stroke="white" stroke-width="2.6" stroke-linecap="round" />
          <path d="M 6.5,20.5 A 3.5,3.5 0 0 0 11.5,25.5" fill="none" stroke="white" stroke-width="2.6" stroke-linecap="round" />
          <path d="M 20.5,25.5 A 3.5,3.5 0 0 0 25.5,20.5" fill="none" stroke="white" stroke-width="2.6" stroke-linecap="round" />
          <!-- 4 vertical rounded capsules -->
          <rect x="9.5" y="9.5" width="2.8" height="13" rx="1.4" fill="white" />
          <rect x="13.7" y="9.5" width="2.8" height="13" rx="1.4" fill="white" />
          <rect x="17.9" y="9.5" width="2.8" height="13" rx="1.4" fill="white" />
          <rect x="22.1" y="9.5" width="2.8" height="13" rx="1.4" fill="white" />
        </svg>
      </div>

      <!-- Mode: BUS QR -->
      <div class="center-icon-container" *ngIf="centerMode === 'qr'">
        <svg class="center-btn-svg" viewBox="0 0 32 32">
          <!-- 4 corner brackets -->
          <path d="M 6.5,11.5 A 3.5,3.5 0 0 1 11.5,6.5" fill="none" stroke="white" stroke-width="2.6" stroke-linecap="round" />
          <path d="M 20.5,6.5 A 3.5,3.5 0 0 1 25.5,11.5" fill="none" stroke="white" stroke-width="2.6" stroke-linecap="round" />
          <path d="M 6.5,20.5 A 3.5,3.5 0 0 0 11.5,25.5" fill="none" stroke="white" stroke-width="2.6" stroke-linecap="round" />
          <path d="M 20.5,25.5 A 3.5,3.5 0 0 0 25.5,20.5" fill="none" stroke="white" stroke-width="2.6" stroke-linecap="round" />
          <!-- QR module blocks -->
          <rect x="10" y="9.8" width="4.2" height="4.2" rx="1.1" fill="white" />
          <rect x="17.8" y="9.8" width="4.2" height="4.2" rx="1.1" fill="white" />
          <rect x="10" y="17.6" width="4.2" height="4.2" rx="1.1" fill="white" />
          <rect x="17.8" y="17.6" width="2.2" height="2.2" rx="0.6" fill="white" />
          <rect x="20.2" y="20" width="2.2" height="2.2" rx="0.6" fill="white" />
        </svg>
      </div>

      <span class="center-label">{{ centerMode === 'otp' ? 'BUS OTP' : 'BUS QR' }}</span>
    </div>
  </div>

  <!-- 4. Pass Tab -->
  <div class="nav-item" [class.active]="activeTab === 'passes'" (click)="navTo('passes')">
    <div class="nav-icon-box">
      <svg class="nav-svg" viewBox="0 0 24 24">
        <path d="M 12,4.5 C 6.5,4.5 2,9 2,14.5 C 2,16.5 3,18 4.5,19 L 19.5,19 C 21,18 22,16.5 22,14.5 C 22,9 17.5,4.5 12,4.5 Z" fill="currentColor" />
        <!-- Inner cutout "1" -->
        <path d="M 10.5,16.5 L 12.5,16.5 L 12.5,9.2 L 10.6,10.4 L 9.8,9.3 L 12.3,7.6 L 14,7.6 L 14,16.5 Z" fill="#ffffff" />
      </svg>
    </div>
    <span class="nav-label">Pass</span>
  </div>

  <!-- 5. Account Tab -->
  <div class="nav-item" [class.active]="activeTab === 'profile'" (click)="navTo('profile')">
    <div class="nav-icon-box">
      <svg class="nav-svg" viewBox="0 0 24 24">
        <circle cx="12" cy="7.5" r="4" fill="currentColor" />
        <path d="M 5,20 L 5,18 C 5,14 8,12 12,12 C 16,12 19,14 19,18 L 19,20 C 19,20.5 18.5,21 18,21 L 6,21 C 5.5,21 5,20.5 5,20 Z" fill="currentColor" />
      </svg>
    </div>
    <span class="nav-label">Account</span>
  </div>
</div>
